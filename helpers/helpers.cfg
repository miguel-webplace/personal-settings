
## -------- visuals ------- ##

LOG="\e[1;34m"
WARN="\e[1;33m"
OK="\e[1;32m"
ENDCOLOR=[0m

log()  { printf '\n\033${LOG}[+] %s\033${ENDCOLOR}' "$*"; }
warn() { printf '\n\033${WARN}[!] %s\033${ENDCOLOR}' "$*"; }
ok() { printf '\n\033${OK}[o] %s\033${ENDCOLOR}' "$*"; }



## -------- installers ------- ##

apt_install() {
	sudo apt install -y "$@"
}

flatpak_install() {
	flatpak install -y flathub "$@"
}

curl_install() {
    curl -fsSL "$@" | sudo sh
}

clear_apt_cache() {
    if [ $1 -ne "skipclear"]; then
        log "Clearing apt cache"
        sudo apt clean
        sudo rm -rf /var/lib/apt/lists/*
    fi
}
