
## -------- visuals ------- ##

LOG="\e[1;34m"
WARN="\e[1;33m"
OK="\e[1;32m"
ENDCOLOR=[0m

log()  { printf '\n\033\e[1;34m[+] %s\033[0m' "$*"; }
warn() { printf '\n\033\e[1;33m[!] %s\033[0m' "$*"; }
ok() { printf '\n\033\e[1;32m[o] %s\033[0m' "$*"; }


## ---------- handlers --------- #

SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"

update_pckgs_list() {
    
    ls "$SCRIPT_DIR/configs" > "$SCRIPT_DIR/packages.txt"
}
